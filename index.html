<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e12"><title>PayFlow</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0d0e12;--card:#181a21;--card2:#22252e;--tx:#f2f3f5;--mut:#8a8f9c;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#pg{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pg::-webkit-scrollbar{display:none}
section{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:18px 16px 24px}
nav{display:flex;background:var(--card);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font-size:24px;padding:8px;opacity:.4;filter:grayscale(1);transition:.2s}
nav button.on{opacity:1;filter:none;transform:scale(1.15)}
.mo{color:var(--mut);font-size:15px}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;margin:2px 0 10px}
.row{display:flex;gap:10px}.row span{flex:1;background:var(--card);border-radius:16px;padding:10px 14px;color:var(--mut);font-size:13px}
.row b{display:block;color:var(--tx);font-size:17px;margin-top:2px}.neg{color:var(--bad)!important}
.in{display:flex;gap:8px;margin:16px 0 10px}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--card2);border-radius:14px;padding:12px 14px;font:inherit;width:100%;min-width:0}
#amt{font-size:26px;font-weight:700;flex:1.2}
.chip{background:var(--card);border:1px solid var(--card2);color:var(--mut);border-radius:14px;padding:0 14px;font:inherit;white-space:nowrap}
.chip.on{background:#14532d;color:var(--ok);border-color:var(--ok)}
#cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.cb{background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--tx);border:2px solid var(--c);border-radius:18px;padding:10px 14px;font:inherit;font-weight:600;display:flex;gap:6px;align-items:center}
.cb:active{transform:scale(.94)}.cb.plus{border-style:dashed;border-color:var(--mut);background:none;color:var(--mut)}
.h{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;font-weight:600}
.h button{background:none;border:0;font-size:20px;color:var(--tx)}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 25%,var(--card2));border:2px solid var(--c);flex:none}
.it div.m{flex:1;min-width:0}.it small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am{font-weight:700;white-space:nowrap}.pos{color:var(--ok)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
.hl{outline:1.5px dashed var(--c);outline-offset:2px}
.mpick{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mpick button,.btn{background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:10px 16px;font:inherit}
.btn{width:100%;margin-top:8px;font-weight:600}.btn.p{background:#4f46e5}.btn.d{color:var(--bad)}
.donut{width:220px;height:220px;margin:0 auto 14px;display:block}
h2{font-size:22px;margin-bottom:12px}h3{font-size:15px;color:var(--mut);margin:20px 0 8px;font-weight:600}
.ce{display:grid;grid-template-columns:44px 1fr 40px 40px 36px;gap:6px;align-items:center;margin-bottom:8px}
.ce input[type=color]{padding:2px;height:44px}.ce button{background:var(--card);color:var(--tx);border:0;border-radius:12px;height:44px}
.ce .emo{text-align:center;padding:8px 0}
#mod{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
#mod.on{display:flex}#box{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
#box>*{margin-bottom:10px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.lock{background:#422006;color:#fbbf24;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="pg">
<section id="p0">
 <div id="stats"></div>
 <div class="in"><input id="amt" type="number" inputmode="numeric" placeholder="Összeg (Ft)"><button class="chip" id="rf" onclick="tgl()">↩ Vissza</button></div>
 <input id="note" placeholder="Megjegyzés (nem kötelező)" style="margin-bottom:12px">
 <div id="cats"></div>
 <div class="h"><span id="lt">Kiadások</span><button onclick="srch()">🔍</button></div>
 <input id="q" placeholder="Keresés (pl. lidl)" style="display:none;margin-bottom:10px" oninput="rList()">
 <div id="list"></div>
</section>
<section id="p1"></section>
<section id="p2"></section>
</main>
<nav><button class="on" onclick="go(0)">🏠</button><button onclick="go(1)">📊</button><button onclick="go(2)">⚙️</button></nav>
<div id="mod" onclick="if(event.target==this)cm()"><div id="box"></div></div>
<script>
const $=s=>document.querySelector(s),K='payflow',MN=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const day=d=>ym(d)+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=n=>Math.round(n).toLocaleString('hu-HU')+' Ft';
const ml=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const sh=(m,k)=>{let y=+m.slice(0,4),n=+m.slice(5)-1+k;y+=Math.floor(n/12);n=(n%12+12)%12;return y+'-'+String(n+1).padStart(2,'0')};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{income:0,active:ym(new Date()),closed:{},cats:[
{id:'k',n:'Kötelező',e:'📌',c:'#ef4444'},{id:'ka',n:'Kaja',e:'🍔',c:'#facc15'},{id:'h',n:'Hobbi',e:'🎮',c:'#a855f7'},
{id:'fil',n:'Elhanyagolható',e:'🛍️',c:'#3b82f6'},{id:'c',n:'Cigi',e:'🚬',c:'#f97316'},{id:'l',n:'Lada',e:'🔧',c:'#ffffff'}],tx:[]};
let refund=false,sm=S.active,sc=null,unl={};
const cat=id=>S.cats.find(c=>c.id==id)||{n:'Törölt',e:'❔',c:'#6b7280'};
const locked=m=>S.closed[m]&&!unl[m];
const inM=m=>S.tx.filter(t=>t.d.startsWith(m)).sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id));
const spend=m=>inM(m).reduce((s,t)=>s+(t.ref?-t.a:t.a),0);
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()}
function go(i){$('#pg').scrollTo({left:i*$('#pg').clientWidth,behavior:'smooth'})}
$('#pg').addEventListener('scroll',()=>{const i=Math.round($('#pg').scrollLeft/$('#pg').clientWidth);document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i==j))});
function tgl(){refund=!refund;$('#rf').classList.toggle('on',refund)}
function srch(){const q=$('#q');q.style.display=q.style.display=='none'?'block':'none';q.value='';rList();if(q.style.display=='block')q.focus()}
function add(id){
 const a=parseInt($('#amt').value);
 if(!a||a<=0){$('#amt').classList.add('shake');setTimeout(()=>$('#amt').classList.remove('shake'),300);$('#amt').focus();return}
 const t=new Date(),d=ym(t)==S.active?day(t):S.active+'-01';
 S.tx.push({id:uid(),a,cat:id,d,note:$('#note').value.trim(),ref:refund});
 $('#amt').value='';$('#note').value='';if(refund)tgl();save();
}
function newCat(){S.cats.push({id:uid(),n:'Új kategória',e:'⭐',c:'#14b8a6'});save();go(2)}
function item(t,click){const c=cat(t.cat);return `<div class="it" style="--c:${c.c}" onclick="${click}" oncontextmenu="delTx('${t.id}');return false"><div class="dot">${c.e}</div><div class="m"><b>${esc(c.n)}</b><small>${t.d.replace(/-/g,'.')}.${t.note?' · '+esc(t.note):''}</small></div><div class="am ${t.ref?'pos':''}">${t.ref?'+':''}${f(t.a)}</div></div>`}
function rStats(){const m=S.active,sp=spend(m),l=S.income-sp;
 $('#stats').innerHTML=`<div class="mo">${ml(m)}</div><div class="big">${f(sp)}</div><div class="row"><span>Bevétel<b>${f(S.income)}</b></span><span>Maradt<b class="${l<0?'neg':''}">${f(l)}</b></span></div>`}
function rCats(){$('#cats').innerHTML=S.cats.map(c=>`<button class="cb" style="--c:${c.c}" onclick="add('${c.id}')"><span>${c.e}</span>${esc(c.n)}</button>`).join('')+`<button class="cb plus" onclick="newCat()">＋</button>`}
function rList(){
 const q=$('#q').value.trim().toLowerCase();let l;
 if(q){l=S.tx.filter(t=>(t.note||'').toLowerCase().includes(q)||cat(t.cat).n.toLowerCase().includes(q)).sort((a,b)=>b.d.localeCompare(a.d));
  const s=l.reduce((s,t)=>s+(t.ref?-t.a:t.a),0);$('#lt').textContent=`${l.length} találat · ${f(s)}`}
 else{l=inM(S.active);$('#lt').textContent='Kiadások'}
 $('#list').innerHTML=l.length?l.map(t=>item(t,`edit('${t.id}')`)).join(''):'<div class="empty">Még nincs tétel. Írj be egy összeget, és koppints egy kategóriára.</div>'}
function rSum(){
 const ms=[...new Set([...S.tx.map(t=>t.d.slice(0,7)),S.active])].sort();
 let h=`<div class="mpick"><button onclick="sm=sh(sm,-1);sc=null;rSum()">‹</button><b>${ml(sm)}${S.closed[sm]?' 🔒':''}</b><button onclick="sm=sh(sm,1);sc=null;rSum()">›</button></div>`;
 if(S.closed[sm]&&unl[sm]===undefined)h+=`<div class="lock">Lezárt hónap, csak olvasható. <a href="#" onclick="unlock('${sm}');return false" style="color:#fff">Szerkesztés engedélyezése</a></div>`;
 const ex=inM(sm).filter(t=>!t.ref),tot=ex.reduce((s,t)=>s+t.a,0),by={};
 ex.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.a);
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 if(sc){const c=cat(sc);h+=`<button class="mpick btn" onclick="sc=null;rSum()">‹ Vissza</button><h2>${c.e} ${esc(c.n)} · ${f(by[sc]||0)}</h2>`+inM(sm).filter(t=>t.cat==sc).map(t=>item(t,`edit('${t.id}')`)).join('');$('#p1').innerHTML=h;return}
 if(!tot){h+='<div class="empty">Ebben a hónapban nincs kiadás.</div>';$('#p1').innerHTML=h;return}
 let cum=0,seg='';rows.forEach(([id,v])=>{const p=v/tot*100;seg+=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${cat(id).c}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-cum}"/>`;cum+=p});
 h+=`<svg class="donut" viewBox="0 0 42 42">${seg}<text x="21" y="22" text-anchor="middle" fill="#f2f3f5" font-size="4.2" font-weight="700">${f(tot)}</text></svg>`;
 h+=rows.map(([id,v])=>{const c=cat(id);return `<div class="it ${id=='fil'?'hl':''}" style="--c:${c.c}" onclick="sc='${id}';rSum()"><div class="dot">${c.e}</div><div class="m"><b>${esc(c.n)}</b><small>${Math.round(v/tot*100)}%</small></div><div class="am">${f(v)}</div></div>`}).join('');
 $('#p1').innerHTML=h}
function rSet(){
 let h=`<h2>Beállítások</h2><h3>Havi bevétel</h3><input type="number" inputmode="numeric" value="${S.income}" onchange="S.income=Math.max(0,parseInt(this.value)||0);save()">
 <h3>Kategóriák</h3>`+S.cats.map((c,i)=>`<div class="ce"><input class="emo" value="${esc(c.e)}" maxlength="4" onchange="S.cats[${i}].e=this.value||'⭐';save()"><input value="${esc(c.n)}" onchange="S.cats[${i}].n=this.value||'Kategória';save()"><input type="color" value="${c.c}" onchange="S.cats[${i}].c=this.value;save()"><button onclick="mv(${i},-1)">▲</button><button onclick="mv(${i},1)">▼</button></div><div style="text-align:right;margin:-4px 0 8px"><a href="#" style="color:var(--bad);font-size:13px" onclick="delCat(${i});return false">Törlés</a></div>`).join('')
 +`<button class="btn" onclick="newCat()">＋ Új kategória</button>
 <h3>Hónapzárás</h3><button class="btn" onclick="closeM()">🔒 ${ml(S.active)} lezárása</button>
 <h3>Adatok</h3><button class="btn" onclick="exp()">📤 Exportálás</button><button class="btn" onclick="$('#imp').click()">📥 Importálás</button><input type="file" id="imp" accept=".json" hidden onchange="imp(this)">`;
 $('#p2').innerHTML=h}
function mv(i,k){const j=i+k;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save()}
function delCat(i){if(confirm('Törlöd a(z) '+S.cats[i].n+' kategóriát? A tételei „Törölt” néven maradnak.')){S.cats.splice(i,1);save()}}
function closeM(){if(confirm(ml(S.active)+' lezárása? Utána új hónap indul, a régi adatok olvashatók maradnak.')){S.closed[S.active]=true;S.active=sh(S.active,1);sm=S.active;save();go(0)}}
function unlock(m){unl[m]=true;render()}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='payflow-mentes-'+day(new Date())+'.json';a.click()}
function imp(el){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx||!d.cats)throw 0;if(confirm('Felülírja a jelenlegi adatokat. Folytatod?')){S=d;sm=S.active;save()}}catch(e){alert('Hibás fájl.')}};if(el.files[0])r.readAsText(el.files[0]);el.value=''}
function delTx(id){if(confirm('Törlöd ezt a tételt?')){const t=S.tx.find(x=>x.id==id);if(t&&locked(t.d.slice(0,7)))return alert('Lezárt hónap. Előbb engedélyezd a szerkesztést.');S.tx=S.tx.filter(x=>x.id!=id);save()}}
function cm(){$('#mod').classList.remove('on')}
function edit(id){
 const t=S.tx.find(x=>x.id==id),m=t.d.slice(0,7),L=locked(m),dis=L?'disabled':'';
 window._c=t.cat;window._r=t.ref;
 $('#box').innerHTML=`${L?`<div class="lock">Lezárt hónap. <a href="#" style="color:#fff" onclick="unlock('${m}');edit('${id}');return false">Szerkesztés engedélyezése</a></div>`:''}
 <input id="ea" type="number" inputmode="numeric" value="${t.a}" ${dis}><div class="chips" id="ec">${S.cats.map(c=>`<button class="cb ${c.id==t.cat?'':'x'}" style="--c:${c.c};${c.id==t.cat?'':'opacity:.4'}" ${dis} onclick="pick('${c.id}',this)">${c.e} ${esc(c.n)}</button>`).join('')}</div>
 <input id="ed" type="date" value="${t.d}" ${dis}><input id="en" placeholder="Megjegyzés" value="${esc(t.note)}" ${dis}>
 <button class="chip ${t.ref?'on':''}" style="padding:12px 14px" ${dis} onclick="window._r=!window._r;this.classList.toggle('on')">↩ Visszatérítés</button>
 ${L?'':`<button class="btn p" onclick="upd('${id}')">Mentés</button><button class="btn d" onclick="cm();delTx('${id}')">Törlés</button>`}<button class="btn" onclick="cm()">Bezár</button>`;
 $('#mod').classList.add('on')}
function pick(id,el){window._c=id;document.querySelectorAll('#ec .cb').forEach(b=>b.style.opacity=.4);el.style.opacity=1}
function upd(id){const t=S.tx.find(x=>x.id==id),a=parseInt($('#ea').value);if(!a||a<=0||!$('#ed').value)return;
 Object.assign(t,{a,cat:window._c,d:$('#ed').value,note:$('#en').value.trim(),ref:!!window._r});cm();save()}
function render(){rStats();rCats();rList();rSum();rSet()}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
